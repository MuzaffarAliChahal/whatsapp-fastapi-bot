<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="675" fill="#0b1f1a"/>
  <rect x="0" y="0" width="1200" height="8" fill="#25d366"/>
  <text x="70" y="110" fill="#25d366" font-size="18" font-weight="600" letter-spacing="3">OPEN SOURCE · PYTHON · FASTAPI</text>
  <text x="70" y="180" fill="#ffffff" font-size="60" font-weight="700">WhatsApp</text>
  <text x="70" y="248" fill="#ffffff" font-size="60" font-weight="700">Support Bot</text>
  <text x="70" y="290" fill="#a7c4bb" font-size="22">FastAPI bot on the WhatsApp Cloud API</text>
  <g font-size="20" fill="#e6f4ef">
    <rect x="70" y="320" width="470" height="54" rx="10" fill="#12342b" stroke="#1f5a48"/>
    <text x="92" y="354">Signed webhooks (HMAC-SHA256)</text>
    <rect x="70" y="384" width="470" height="54" rx="10" fill="#12342b" stroke="#1f5a48"/>
    <text x="92" y="418">Per-user conversation state in SQLAlchemy</text>
    <rect x="70" y="448" width="470" height="54" rx="10" fill="#12342b" stroke="#1f5a48"/>
    <text x="92" y="482">Idempotent delivery, background replies</text>
    <rect x="70" y="512" width="470" height="54" rx="10" fill="#12342b" stroke="#1f5a48"/>
    <text x="92" y="546">pytest + respx, Docker, GitHub Actions</text>
  </g>
  <!-- phone mock -->
  <rect x="700" y="80" width="400" height="520" rx="36" fill="#ece5dd" stroke="#1f5a48" stroke-width="6"/>
  <rect x="700" y="80" width="400" height="70" rx="30" fill="#075e54"/>
  <rect x="700" y="120" width="400" height="30" fill="#075e54"/>
  <circle cx="745" cy="115" r="20" fill="#25d366"/>
  <text x="776" y="111" fill="#fff" font-size="20" font-weight="600">Acme Store</text>
  <text x="776" y="133" fill="#cfe9e4" font-size="14">bot · online</text>
  <g font-size="16">
    <rect x="980" y="175" width="90" height="40" rx="10" fill="#dcf8c6"/>
    <text x="1004" y="201" fill="#111">hi</text>
    <rect x="725" y="230" width="300" height="118" rx="10" fill="#fff"/>
    <text x="740" y="256" fill="#111">Hi Ali! Welcome to Acme Store.</text>
    <text x="740" y="282" fill="#111">1. Track my order</text>
    <text x="740" y="306" fill="#111">2. Business hours</text>
    <text x="740" y="330" fill="#111">3. Talk to a person</text>
    <rect x="1015" y="365" width="55" height="40" rx="10" fill="#dcf8c6"/>
    <text x="1036" y="391" fill="#111">1</text>
    <rect x="725" y="420" width="300" height="44" rx="10" fill="#fff"/>
    <text x="740" y="447" fill="#111">Please send your order number.</text>
    <rect x="960" y="478" width="110" height="40" rx="10" fill="#dcf8c6"/>
    <text x="978" y="504" fill="#111">A1001</text>
    <rect x="725" y="530" width="330" height="50" rx="10" fill="#fff"/>
    <text x="740" y="560" fill="#111">Order A1001 is out for delivery.</text>
  </g>
  <text x="70" y="630" fill="#6f948a" font-size="16">Muzaffar Ali Hakim · github.com/MuzaffarAliChahal/whatsapp-fastapi-bot</text>
</svg>
